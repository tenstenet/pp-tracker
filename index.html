<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — FoodDiary</title>
  <link rel="icon" href="images/logo_1.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header container">
    <a href="index.html" class="header__logo">
      <img src="images/logo_1.png" alt="Логотип" class="logo__img">
      FoodDiary
    </a>
  </header>

  <main class="container">
    <section class="auth">
      <div class="auth__card">
        <h1 class="auth__title">Вход в аккаунт</h1>
        <p class="auth__subtitle">Рады видеть вас снова!</p>

        <form class="auth__form" id="login-form" novalidate>
          <div class="form__group">
            <label for="login-email" class="form__label">Email</label>
            <input type="email" id="login-email" name="email" class="form__input" placeholder="example@mail.com" required>
            <span class="form__error" data-error-for="login-email"></span>
          </div>

          <div class="form__group">
            <label for="login-password" class="form__label">Пароль</label>
            <input type="password" id="login-password" name="password" class="form__input" placeholder="••••••••" required>
            <span class="form__error" data-error-for="login-password"></span>
          </div>

          <button type="submit" class="button button_theme_green button_full">Войти</button>
        </form>

        <p class="auth__footer-text">
          Ещё нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="footer container">
    <div class="footer__inner">
      <div class="footer__header">
        <a href="index.html" class="footer__logo">
          <img src="images/logo_1.png" alt="Логотип" class="logo__img">
          FoodDiary
        </a>
        <div class="footer__socials">
          <a href="#" class="social-icon" aria-label="Telegram">tg</a>
          <a href="#" class="social-icon" aria-label="VK">vk</a>
          <a href="#" class="social-icon" aria-label="YouTube">yt</a>
        </div>
      </div>

      <div class="footer__body">
        <div class="footer__contact-info">
          <span class="footer__contact-badge">Контакты:</span>
          <p>Email: support@fooddiary.ru</p>
          <p>Телефон: +7 (800) 222-22-22</p>
          <p>Адрес: г. Москва, ул. Киевская, д. 1</p>
        </div>
      </div>

      <div class="footer__bottom">
        <p>© 2026 FoodDiary. Все права защищены.</p>
        <a href="privacy.html" class="footer__privacy">Политика конфиденциальности</a>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
